[package]
name = "mondeep-mcp"
description = "Mondeep MCP サーバー（Claude Desktop から学習記録を保存する）"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mondeep-mcp"
path = "src/main.rs"

[dependencies]
mondeep-core.workspace = true
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
serde.workspace = true
serde_json.workspace = true
schemars = "1"
anyhow.workspace = true
chrono.workspace = true
